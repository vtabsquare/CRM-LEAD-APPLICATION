services:
  # Backend Service (FastAPI)
  - type: web
    name: crm-backend
    env: python
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/health"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10
      - key: ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: EXCEL_FILE_PATH
        sync: false
      - key: GOOGLE_SHEET_NAME
        value: CRM Leads
      - key: CREDENTIALS_FILE
        value: google_credentials.json
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: EMAIL_SUBJECT
        value: New CRM Lead Submission
      - key: EMAIL_SIMPLE_MODE
        value: "0"
      - key: EMAIL_TRANSPORT
        value: gmail_api
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: "8000"
      - key: WHATSAPP_SERVICE_PORT
        value: "5000"
      - key: FLASK_DEBUG
        value: "False"
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: AI_ENABLED
        value: "True"
      - key: HF_MODEL
        value: microsoft/Phi-3-mini-4k-instruct
      - key: HF_API_BASE_URL
        value: https://api-inference.huggingface.co/v1
      - key: HF_ENABLED
        value: "False"
      # Secret variables (set these in Render dashboard)
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: DEFAULT_NOTIFICATION_EMAIL
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: PATIENT_ADMISSION_SHEET_ID
        sync: false
      - key: HOMECARE_SHEET_ID
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        value: whatsapp:+14155238886
      - key: GROQ_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false

  # Frontend Service (React)
  - type: web
    name: crm-frontend
    env: node
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm run preview"
    healthCheckPath: "/"
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: VITE_API_URL
        value: https://crm-backend.onrender.com

# WhatsApp Service (Optional - separate service)
  - type: web
    name: crm-whatsapp
    env: python
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && python whatsapp_service.py"
    healthCheckPath: "/health"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        value: whatsapp:+14155238886
      - key: FLASK_DEBUG
        value: "False"
